<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1974" width="600" height="1974" role="img" aria-labelledby="quest-title quest-desc" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace"><title id="quest-title">Quest: catch cheaters without touching prod</title><desc id="quest-desc">A game-style quest for setting up fpsdet on logs you already have. HUD: prod HP 100 of 100, players banned 0, network offline. level 1, loot the repo: git clone + demo, Zero dependencies. Inventory weight: 0 kg.; level 2, export your logs: a week of matches, Raid your own log server. No aggro.; level 3, go incognito: 1 line: convert.py, Names &amp; IPs dropped. Ids salted: +100 stealth.; level 4, score it: 1 line: fpsdet score, Runs offline. Prod never even alt-tabs.; level 5, read the cases: open dashboard.html, A human reviews. Nobody gets banned. GG.. Achievement unlocked: Touched the logs, not prod. Loading tip: The ban hammer is not in this build. automated_action: none</desc><rect width="600" height="1974" rx="20" fill="#040718"/><rect x="1" y="1" width="598" height="1972" rx="19" fill="none" stroke="#242e5e" stroke-width="2"/><rect x="1" y="1" width="598" height="150" rx="19" fill="#0a102c"/><rect x="1" y="132" width="598" height="20" fill="#0a102c"/><line x1="0" y1="152" x2="600" y2="152" stroke="#242e5e" stroke-width="2"/><circle cx="34" cy="34" r="7" fill="#ff5470"/><circle cx="56" cy="34" r="7" fill="#d8b26c"/><circle cx="78" cy="34" r="7" fill="#2dd4bf"/><text x="110" y="41" font-size="22" font-weight="700" fill="#d8b26c" text-anchor="start" letter-spacing="3">QUEST</text><text x="34" y="88" font-size="27" font-weight="700" fill="#e6ebf9" text-anchor="start">Catch cheaters without</text><text x="34" y="126" font-size="27" font-weight="700" fill="#e6ebf9" text-anchor="start">touching prod</text><text x="34" y="194" font-size="18" font-weight="700" fill="#d8b26c" text-anchor="start" letter-spacing="1"