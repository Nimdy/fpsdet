[project]
name = "fpsdet"
version = "0.4.0"
description = "Server-side evidence for FPS cheats: deterministic checks on what the dedicated server accepted and what each client could know"
readme = "README.md"
license = { text = "PolyForm-Small-Business-1.0.0" }
requires-python = ">=3.11"
authors = [{ name = "ZeroBandwidth" }]
dependencies = []

[project.optional-dependencies]
# Only checking external records' Ed25519 signatures needs it. Everything else is standard library.
auth = ["cryptography>=42"]

[project.scripts]
fpsdet = "fpsdet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
