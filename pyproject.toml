[project]
name = "fpsdet"
version = "0.3.0"
description = "Server-side human-play and gear-rule baselines for FPS anti-cheat"
readme = "README.md"
license = { text = "PolyForm-Small-Business-1.0.0" }
requires-python = ">=3.11"
authors = [{ name = "ZeroBandwidth" }]
dependencies = []

[project.optional-dependencies]
# Only checking external records' Ed25519 signatures needs it. Everything else is standard library.
auth = ["cryptography>=42"]

[project.scripts]
fpsdet = "fpsdet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
